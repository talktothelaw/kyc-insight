# GitLab CI/CD pipeline for the KYC Insight iOS SDK.
#
# Two release channels, both live. The mirror pushes every branch AND every
# tag to the GitHub repository consumers resolve from, so how a consumer
# pins is their choice:
#
#   // Swift Package Manager — track main
#   .package(url: "https://github.com/talktothelaw/kyc-insight.git", branch: "main")
#   // Swift Package Manager — pin a tagged release
#   .package(url: "https://github.com/talktothelaw/kyc-insight.git", from: "0.5.1")
#
#   # CocoaPods — resolved from Trunk, no source needed
#   pod 'KYCWidget'
#
# The Trunk release is a MANUAL step and deliberately so: `pod trunk push`
# needs a session token tied to a person, not a CI variable. Cut the tag,
# let this pipeline mirror it to GitHub (Trunk clones the tag from there
# during validation), then run `pod trunk push KYCWidget.podspec`.
#
# Both channels publish by being pushed, so both have to stay green:
# `validate` builds and tests the package on branches AND on tags, and the
# mirror only runs after it passes. A red build never reaches a consumer.
#
# Required CI/CD variables:
#   MIRROR_SSH_PRIVATE_KEY — deploy key with write access to the GitHub mirror

stages:
  - validate
  - mirror

# ─── validate ──────────────────────────────────────────────────────
# Runs on every push, tag and merge request. Needs a macOS runner tagged `macos`
# with Xcode. Without one this job never runs and the mirror is UNGATED —
# which removes the only thing between a broken commit and every consumer
# app, so provision one before relying on main as the release channel.
validate:
  stage: validate
  tags:
    - macos
  script:
    # xcodebuild with an explicit iOS destination, NOT `swift build`: the
    # package is .iOS(.v15)-only, and on a mac host `swift build` targets
    # macOS and fails on iOS-only API (`accentColor is only available in
    # macOS 10.15 or newer`). That would leave this job permanently red and,
    # because the mirror needs it, block every release.
    - xcodebuild -version
    - xcodebuild -scheme KYCWidget -destination 'generic/platform=iOS' build
    - |
      SIM=$(xcrun simctl list devices available --json \
        | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next((x['udid'] for k,v in d.items() if 'iOS' in k for x in v), ''))")
      if [ -z "$SIM" ]; then
        echo "No iOS simulator on this runner — build verified, tests skipped."
        exit 0
      fi
      xcodebuild test -scheme KYCWidget -destination "id=$SIM"
  rules:
    - if: '$SKIP_IOS_VALIDATE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Tags are a release channel too, so a tag pipeline must be gated by the
    # same build. Without this the tag mirrors ungated — `needs: optional`
    # lets the mirror run when validate did not exist for that pipeline.
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

# ─── mirror ────────────────────────────────────────────────────────
# Pushes branches + tags to the GitHub repository consumers resolve from.
# Runs only after `validate` succeeds, so main is never mirrored broken.
mirror_to_talktothelaw:
  stage: mirror
  image: alpine:latest
  needs:
    - job: validate
      optional: true
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    MIRROR_URL: "git@github.com:talktothelaw/kyc-insight.git"
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$MIRROR_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
    - git config --global user.email "nwokolawrence6@gmail.com"
    - git config --global user.name "Lawrence Nwoko"
  script:
    - git remote remove mirror 2>/dev/null || true
    - git remote add mirror "$MIRROR_URL"
    - git fetch origin "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
    - git push --prune mirror "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
    # Quoted as a whole: an unquoted YAML scalar containing ": " parses as a
    # mapping, which GitLab rejects with "script config should be a string".
    - 'echo "Mirrored — branch consumers update via SPM/CocoaPods; tag consumers resolve the new tag"'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
